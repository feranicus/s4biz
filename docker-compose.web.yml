# s4biz.io — the corporate site (container s4biz-web).
#
# IT JOINS THE EXISTING videodead_appnet AND ONLY THAT NETWORK.
#
# The shared reverse proxy (videodead-caddy) owns :443 on this droplet and fronts cybergod.ai,
# jobhuntwow.com and the others. It reaches this container as http://s4biz-web:8000. Two networks
# would be an outage waiting to happen: Docker's DNS returns both addresses and the proxy dials
# them at random, so roughly half the requests hit an address it cannot route to. That is the
# documented cause of an intermittent 502 on a sibling site here. ONE network, defined in ONE file.
#
# IT DOES NOT TOUCH ANYTHING ELSE ON THE BOX. Amnezia VPN, VideoDead, joplin and the colt stack are
# untouched. This is its own compose project (-p s4biz-stack) with its own container name.
#
# NEVER RUN THIS WITH --remove-orphans. It defines one service; anything else in the project would
# look like an orphan and be deleted. That has already destroyed a sibling stack's log shipper and
# both of its bots on this host.
services:
  web:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: s4biz-web:latest
    container_name: s4biz-web
    env_file:
      # Optional. Absent on a fresh box, which is fine: every value below has a working default and
      # the only things that belong in here are secrets (GMAIL_SA_B64, BOT_TOKEN).
      - path: ./s4biz.env
        required: false
    environment:
      - SERVICE=s4biz-web
      - DATA_DIR=/data
      - EVENTS_LOG=/var/log/s4biz/events.log
      # Where a contact enquiry goes. A comma separated list; notify.py sends to all of them.
      - ALERT_EMAIL=feranicus@s4biz.io
      # SEO. The gate serves a 404 to anything identifying as a bot that is not on this list, which
      # is what keeps scrapers and AI training crawlers out. It MUST stay in agreement with
      # public/robots.txt, and tests/test_seo.py asserts that.
      - BOT_404=1
      - BOT_404_ALLOW=googlebot,bingbot,duckduckbot,linkedinbot,slackbot,whatsapp,telegrambot,applebot
      # Two years of HSTS is set unconditionally by the app. PRELOAD is not, because submission to
      # hstspreload.org is a one way door: turn it on deliberately, once, after the domain has been
      # live on this host for a while.
      - HSTS_PRELOAD=0
    volumes:
      - s4biz_data:/data
      - s4biz_events:/var/log/s4biz
    # NO PUBLISHED PORT, DELIBERATELY.
    #
    # This container does not need one. Public traffic arrives through the shared proxy over the
    # docker network as http://s4biz-web:8000, and every local health check goes through
    # `docker exec`, which needs no host port at all.
    #
    # It used to publish 127.0.0.1:8091, chosen because it was not in a list of ports the sibling
    # projects were known to use. The first real deploy failed with "Bind for 127.0.0.1:8091
    # failed: port is already allocated": the list was reasoning about the host rather than
    # measuring it, and there are six projects plus assorted dev containers on this box. Picking a
    # different number would repeat the same bet with a different guess.
    #
    # Publishing nothing makes the collision structurally impossible instead of unlikely, and it
    # is also the smaller attack surface. Diagnosing without the proxy still works:
    #     docker exec s4biz-web curl -s localhost:8000/api/health
    networks: [videodead_appnet]
    restart: unless-stopped

  # ---- log shipper -------------------------------------------------------------------------
  # Sends this site's events into the SAME Loki the other projects on this box already use, so
  # there is one place to look rather than a second observability stack.
  #
  # It joins TWO networks and that is correct here, unlike the web container: it needs to reach
  # Loki, which lives on the neighbour's network. The one-network rule exists because the shared
  # PROXY dials the web container by name and would pick a random address. Nothing dials promtail,
  # so there is no ambiguity to create.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: s4biz-promtail
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      - LOKI_URL=${LOKI_URL:-http://videodead-loki-1:3100/loki/api/v1/push}
    volumes:
      - ./obs/promtail.yml:/etc/promtail/config.yml:ro
      - s4biz_events:/logs:ro
      - s4biz_positions:/positions
    networks: [videodead_appnet, lokinet]
    restart: unless-stopped
    depends_on: [web]

volumes:
  s4biz_data: {}
  s4biz_events: {}
  s4biz_positions: {}

networks:
  videodead_appnet:
    external: true
  # The network Loki is on. Named through a variable because it differs between the production box
  # and a fresh staging twin; the deploy discovers it and writes .env before compose runs.
  lokinet:
    external: true
    name: ${LOKI_NETWORK:-videodead_appnet}
